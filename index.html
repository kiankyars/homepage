<body>
  <!-- Night Mode Toggle -->
  <div class="night-mode-toggle">
    <button id="nightModeToggle" class="toggle-button" aria-label="Toggle night mode">
      <div class="toggle-track">
        <div class="toggle-thumb"></div>
      </div>
      <span class="toggle-label">🌙</span>
    </button>
  </div>

  <div class="container">
    <div class="content">
      <h1 class="title">Hello, I'm Kian</h1>
      <p class="subtitle">🏠 Edmonton | 💼 UAlberta</p>
      <div class="icons">
        <a href="https://github.com/kiankyars" class="icon">
          <img src="./imgs/github.svg" alt="GitHub">
          <span>GitHub</span>
        </a>
        <a href="https://www.goodreads.com/user/show/108079212-kian" class="icon">
          <img src="./imgs/goodreads.svg" alt="Goodreads">
          <span>Goodreads</span>
        </a>
        <a href="https://www.linkedin.com/in/kyars" class="icon">
          <img src="./imgs/linkedin.svg" alt="LinkedIn">
          <span>LinkedIn</span>
        </a>
        <a href="https://medium.com/@kyars" class="icon">
          <img src="./imgs/medium.svg" alt="Medium">
          <span>Medium</span>
        </a>
        <a href="https://twitter.com/neuralkian" class="icon">
          <img src="./imgs/x.svg" alt="X">
          <span>X</span>
        </a>
        <a href="https://www.strava.com/athletes/kyars" class="icon">
          <img src="./imgs/strava.svg" alt="Strava">
          <span>Strava</span>
        </a>
        <a href="https://www.youtube.com/@kiankyars" class="icon">
          <img src="./imgs/youtube.svg" alt="YouTube">
          <span>Personal YouTube</span>
        </a>
        <a href="https://www.youtube.com/@neuralkian" class="icon">
          <img src="./imgs/escher.svg" alt="YouTube">
          <span>Technical YouTube</span>
        </a>
        <a href="https://calendar.app.google/zCVm4G9X42sqKqfX8" class="icon">
          <img src="./imgs/calendar.svg" alt="Co-working">
          <span>Co-working</span>
        </a>
        <a href="mailto:kkyars@ualberta.ca" class="icon">
          <img src="./imgs/email.svg" alt="Email">
          <span>Email</span>
        </a>
        <a href="https://kiankyars.github.io/" class="icon">
          <img src="./imgs/blog.svg" alt="Blog">
          <span>Blog</span>
        </a>
        <a href="CV.pdf" class="icon">
          <img src="./imgs/cv.svg" alt="CV">
          <span>CV</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Wait for DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', function() {
      // Night mode functionality
      const toggle = document.getElementById('nightModeToggle');
      const body = document.body;
      
      console.log('Toggle element:', toggle);
      console.log('Body element:', body);
      
      if (!toggle) {
        console.error('Toggle button not found!');
        return;
      }
      
      // Check for saved preference or default to light mode
      const savedMode = localStorage.getItem('nightMode');
      console.log('Saved mode:', savedMode);
      
      if (savedMode === 'true') {
        body.classList.add('night-mode');
        toggle.classList.add('active');
      }
      
      toggle.addEventListener('click', function(e) {
        console.log('Toggle clicked!');
        e.preventDefault();
        e.stopPropagation();
        
        body.classList.toggle('night-mode');
        toggle.classList.toggle('active');
        
        console.log('Night mode active:', body.classList.contains('night-mode'));
        
        // Save preference
        localStorage.setItem('nightMode', body.classList.contains('night-mode'));
      });
    });
  </script>
</body>

</html>
