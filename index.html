<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kian Kyars</title>
  <style>
    body {
      background-color: #f7fafc;
      color: #1a202c;
      font-family: Arial, sans-serif;
      padding: 1rem 2.5rem;
      margin: 0;
    }

    .container {
      height: 64vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      max-width: 40rem;
      text-align: center;
    }

    .title {
      font-size: 2rem;
      font-weight: bold;
    }

    .subtitle {
      font-size: 1.25rem;
      margin: 1rem 0;
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .icon {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }

    .icon img {
      height: 2rem;
      width: 2rem;
      transition: transform 0.3s;
    }

    .icon span {
      display: none;
      position: absolute;
      bottom: -1.5rem;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 0.2rem;
    }

    .icon:hover img {
      transform: translateY(-1.5rem);
    }

    .icon:hover span {
      display: block;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="content">
      <h1 class="title">Hello, I'm Kian Kyars</h1>
      <p class="subtitle">🏠 Edmonton | 💼 UAlberta</p>
      <div class="icons">
        <a href="https://github.com/kiankyars" class="icon">
          <img src="./imgs/github.svg" alt="GitHub">
          <span>GitHub</span>
        </a>
        <a href="https://www.goodreads.com/user/show/108079212-kian" class="icon">
          <img src="./imgs/goodreads.svg" alt="Goodreads">
          <span>Goodreads</span>
        </a>
        <a href="https://www.linkedin.com/in/kyars" class="icon">
          <img src="./imgs/linkedin.svg" alt="LinkedIn">
          <span>LinkedIn</span>
        </a>
        <a href="https://medium.com/@kyars" class="icon">
          <img src="./imgs/medium.svg" alt="Medium">
          <span>Medium</span>
        </a>
        <a href="https://twitter.com/neuralkian" class="icon">
          <img src="./imgs/x.svg" alt="X">
          <span>X</span>
        </a>
        <a href="https://www.strava.com/athletes/kyars" class="icon">
          <img src="./imgs/strava.svg" alt="Strava">
          <span>Strava</span>
        </a>
        <a href="https://www.youtube.com/@kiankyars" class="icon">
          <img src="./imgs/youtube.svg" alt="YouTube">
          <span>YouTube</span>
        </a>
        <a href="mailto:kkyars@ualberta.ca" class="icon">
          <img src="./imgs/email.svg" alt="Email">
          <span>Email</span>
        </a>
      </div>
    </div>
  </div>
</body>

</html>
